name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run format:md:check
      - run: npm run setup
      - run: ./gradlew build
      - run: npm run typecheck
      - run: npm run test:unit
      - uses: actions/upload-artifact@v6
        with:
          name: folkways-jars
          path: build/libs/*.jar
          if-no-files-found: error
  game-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: core
            profiles: base cookery
          - mod: vanilla
            profiles: base cookery
          - mod: create
            profiles: base
          - mod: cookery
            profiles: cookery
          - mod: epicfite
            profiles: epicfight
    name: GameTests (${{ matrix.mod }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run setup
      - name: Run ${{ matrix.mod }} GameTests
        shell: bash
        env:
          GAME_TEST_MOD: ${{ matrix.mod }}
          GAME_TEST_PROFILES: ${{ matrix.profiles }}
        run: |
          mkdir -p run/gametest/ci
          set -o pipefail
          failed=0
          for profile in $GAME_TEST_PROFILES; do
            game_dir="run/gametest/$GAME_TEST_MOD/$profile"
            mkdir -p "$game_dir"
            printf 'eula=true\n' > "$game_dir/eula.txt"
            gradle_args=("-PgameTestMod=$GAME_TEST_MOD")
            if [[ "$profile" == cookery ]]; then
              gradle_args+=(-PcookeryTests=true)
            fi
            if [[ "$profile" == epicfight ]]; then
              gradle_args+=(-PepicfightTests=true)
            fi
            status=failure
            if timeout --signal=TERM --kill-after=60s 50m ./gradlew "${gradle_args[@]}" --console=plain runGameTestServer 2>&1 | tee "run/gametest/ci/$GAME_TEST_MOD-$profile.log"; then
              status=success
            else
              failed=1
            fi
            if ! node scripts/ci/write-game-test-junit.mjs "$GAME_TEST_MOD-$profile" "$status"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gametest-${{ matrix.mod }}-reports
          path: |
            run/gametest/ci/*.xml
            run/gametest/ci/*.log
            run/gametest/${{ matrix.mod }}/**/logs/**
            run/gametest/${{ matrix.mod }}/**/crash-reports/**
          if-no-files-found: warn
  client-smoke:
    needs: build
    name: Client smoke (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: founding
            artifact: founding
            spec: tests/e2e/founding-smoke.spec.ts
          - label: Epic Fight
            artifact: epicfight
            spec: tests/e2e/epicfight-acceptance.spec.ts
          - label: Epic Fight terrain
            artifact: epicfight-terrain
            spec: tests/e2e/epicfight-terrain.spec.ts
          - label: Epic Fight GEO
            artifact: epicfight-geo
            spec: tests/e2e/epicfight-geo.spec.ts
          - label: Epic Fight save restart
            artifact: epicfight-lifecycle
            spec: tests/e2e/epicfight-lifecycle.spec.ts
          - label: Epic Fight multiplayer
            artifact: epicfight-multiplayer
            spec: tests/e2e/epicfight-multiplayer.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - name: Install Linux client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libasound2t64
      - run: npm ci
      - run: npm run setup
      - name: Run focused real-client smoke tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/tests/out/e2e/playwright/junit.xml
        run: >-
          npm exec -- playwright test --config tests/e2e/playwright.config.ts
          ${{ matrix.spec }}
          --workers=1 --reporter=line,junit
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-smoke-results-${{ matrix.artifact }}
          path: tests/out/
          if-no-files-found: warn
  nightly:
    # Every push to master replaces the "nightly" prerelease with that commit's jars.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, game-tests, client-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: folkways-jars
          path: jars
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -f jars/*-sources.jar
          gh release delete nightly --cleanup-tag --yes || true
          cat > notes.md <<EOF
          Built automatically from master at ${GITHUB_SHA::7}. Untested pre-release; back up your world before trying it.

          Install **folkways-core** and **folkways-vanilla**, plus LDLib2. Add **folkways-create** only with Create,
          **folkways-modulargolems** only with Modular Golems, and **folkways-cookery** only with Kaleidoscope Cookery 1.6.0.
          Add **folkways-war** for optional RTS controls in the V overhead view, and **folkways-epicfight** only with Epic Fight 21.17.3.1.
          All Folkways jars must come from the same build.
          EOF
          gh release create nightly jars/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes-file notes.md
