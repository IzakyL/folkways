name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run setup
      - name: Build
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            args+=("-Pversion_suffix=nightly.${GITHUB_SHA::7}")
          fi
          ./gradlew build "${args[@]}"
      - run: npm run typecheck
      - run: npm run test:unit
      - uses: actions/upload-artifact@v6
        with:
          name: folkways-jars
          path: build/libs/*.jar
          if-no-files-found: error
  game-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: core
            suites: core core-cookery
          - label: vanilla
            suites: vanilla cookery-base
          - label: cookery
            suites: cookery tavern
          - label: carts
            suites: carts
          - label: create
            suites: create firefighting
          - label: golems
            suites: golems
          - label: firearms
            suites: tacz warfare
          - label: carving
            suites: carving create-placement
          - label: assistant
            suites: assistant
          - label: epicfight
            suites: epicfight
    name: GameTests (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run setup
      - name: Run ${{ matrix.label }} GameTests
        shell: bash
        env:
          GAME_TEST_SUITES: ${{ matrix.suites }}
        run: |
          mkdir -p run/gametest/ci
          set -o pipefail
          failed=0
          for suite in $GAME_TEST_SUITES; do
            game_dir="run/gametest/$suite"
            mkdir -p "$game_dir"
            printf 'eula=true\n' > "$game_dir/eula.txt"
            status=failure
            if timeout --signal=TERM --kill-after=60s 50m ./gradlew "-Psuite=$suite" -PperfBudget=warn --console=plain runGameTestServer 2>&1 | tee "run/gametest/ci/$suite.log"; then
              status=success
            else
              failed=1
            fi
            if [[ -f "$game_dir/perf-warnings.txt" ]]; then
              while IFS= read -r warning; do
                echo "::warning title=Perf budget ($suite)::$warning"
              done < "$game_dir/perf-warnings.txt"
            fi
            if ! node .github/scripts/write-game-test-junit.mjs "$suite" "$status"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gametest-${{ matrix.label }}-reports
          path: |
            run/gametest/ci/*.xml
            run/gametest/ci/*.log
            run/gametest/**/logs/**
            run/gametest/**/crash-reports/**
          if-no-files-found: warn
  client-smoke:
    needs: build
    name: Client smoke (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: founding
            artifact: founding
            spec: tests/e2e/founding-equivalence.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - name: Install Linux client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libasound2t64
      - run: npm ci
      - run: npm run setup
      - name: Run focused real-client smoke tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/tests/out/e2e/playwright/${{ matrix.artifact }}.xml
        run: >-
          npm exec -- playwright test --config tests/e2e/playwright.config.ts
          ${{ matrix.spec }}
          --workers=1 --reporter=line,junit
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-smoke-results-${{ matrix.artifact }}
          path: tests/out/
          if-no-files-found: warn
  nightly:
    # Every push to master replaces the "nightly" release (marked Latest so it leads the repo page) with that commit's jars.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, game-tests, client-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: folkways-jars
          path: jars
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -f jars/*-sources.jar
          gh release delete nightly --cleanup-tag --yes || true
          cat > notes.md <<EOF
          Built automatically from master at ${GITHUB_SHA::7} (mod version ends in \`-nightly.${GITHUB_SHA::7}\`). Untested pre-release.

          Install **folkways-core** and **folkways-vanilla**, plus LDLib2. Add **folkways-airline** for airports with Create and Sable, and **folkways-assistant** for the colony assistant. All Folkways jars must come from the same build.

          When upgrading, remove the old **folkways-carts**, **folkways-carving**, **folkways-chiselsandbits**, **folkways-cookery**, **folkways-create**, **folkways-epicfight**, **folkways-firearms** and **folkways-golems** jars. Core and Vanilla now provide these integrations.

          Back up your world before opening it with this build. Saves from releases and earlier nightlies upgrade automatically to Folkways data version 5. Downgrades are unsupported.
          EOF
          gh release create nightly jars/*.jar --latest --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes-file notes.md
