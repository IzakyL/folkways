name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run setup
      - run: ./gradlew build
      - run: npm run typecheck
      - run: npm run test:unit
      - uses: actions/upload-artifact@v6
        with:
          name: folkways-jars
          path: build/libs/*.jar
          if-no-files-found: error
  game-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            gradle-args: ""
          - profile: cookery
            gradle-args: "-PcookeryTests=true"
    name: GameTests (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - run: npm ci
      - run: npm run setup
      - name: Run ${{ matrix.profile }} GameTests
        shell: bash
        run: |
          mkdir -p run/gametest/ci
          printf 'eula=true\n' > run/gametest/eula.txt
          set -o pipefail
          timeout --signal=TERM --kill-after=60s 50m ./gradlew ${{ matrix.gradle-args }} --console=plain runGameTestServer 2>&1 | tee "run/gametest/ci/${{ matrix.profile }}.log"
      - name: Write JUnit result
        if: always()
        run: node scripts/ci/write-game-test-junit.mjs "${{ matrix.profile }}" "${{ job.status }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gametest-${{ matrix.profile }}-reports
          path: |
            run/gametest/ci/*.xml
            run/gametest/ci/*.log
            run/gametest/logs/**
            run/gametest/crash-reports/**
          if-no-files-found: warn
  client-smoke:
    needs: build
    name: Client smoke (founding and batch compost)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/cache@v5
        with:
          path: .blockwright-store
          key: blockwright-mods-${{ hashFiles('blockwright.toml') }}
      - name: Install Linux client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libasound2t64
      - run: npm ci
      - run: npm run setup
      - name: Run focused real-client smoke tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/tests/out/e2e/playwright/junit.xml
        run: >-
          npm exec -- playwright test --config tests/e2e/playwright.config.ts
          tests/e2e/founding-smoke.spec.ts tests/e2e/batch-compost.spec.ts
          --workers=1 --reporter=line,junit
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: client-smoke-results
          path: tests/out/
          if-no-files-found: warn
  nightly:
    # Every push to master replaces the "nightly" prerelease with that commit's jars.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, game-tests, client-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: folkways-jars
          path: jars
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -f jars/*-sources.jar
          gh release delete nightly --cleanup-tag --yes || true
          cat > notes.md <<EOF
          Built automatically from master at ${GITHUB_SHA::7}. Untested pre-release; back up your world before trying it.

          Install **folkways-core** and **folkways-vanilla**, plus LDLib2. Add **folkways-create** only with Create,
          **folkways-modulargolems** only with Modular Golems, and **folkways-cookery** only with Kaleidoscope Cookery 1.6.0.
          All Folkways jars must come from the same build.
          EOF
          gh release create nightly jars/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes-file notes.md
