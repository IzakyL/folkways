# Measures folkways itself, mixins included; off unless BLOCKWRIGHT_COVERAGE=1 (npm run test:coverage).
[coverage]
mods = ["folkways"]
sources = ["src/main/java"]

[profile.bench.neoforge]
jvm_args = ["-Xmx3G"]

[profile.bench.neoforge.server]
world = "vanilla"
properties = { "level-seed" = "folkways-promo-land", "generate-structures" = "false", "max-tick-time" = "-1", "view-distance" = "20", "entity-broadcast-range-percentage" = "300" }

# The bench films its run through the promo's shaders. The film is sped up, so the camera holds a low frame rate and
# leaves the GPU and the CPU to the server being measured.
[profile.bench.neoforge.client]
game_args = ["--width", "1920", "--height", "1080"]
options = { overrideWidth = "1920", overrideHeight = "1080", maxFps = "20", renderDistance = "24", graphicsMode = "1", entityShadows = "true", entityDistanceScaling = "5.0", biomeBlendRadius = "3", ao = "true", fov = "0.0", particles = "1", tutorialStep = "none", pauseOnLostFocus = "false", bobView = "false", soundCategory_master = "0.0" }

[profile.bench.neoforge.client.display]
device = "gpu"
width = 1920
height = 1080

# The town stands on modded land (Terralith biomes over Tectonic landforms).
[profile.bench.mods]
lithostitched = { target = ["server", "client"] }
terralith = { target = ["server", "client"] }
tectonic = { target = ["server", "client"] }
sodium = { target = ["client"] }
iris = { target = ["client"] }

# The bench's roaming cameras: each is one more client joined to the bench server, sent from spot to spot as the run
# goes. A camera is a player of its own, so each has its own account; the rest is the bench client's.
[profile.bench-cam-1.neoforge]
jvm_args = ["-Xmx2G"]

[profile.bench-cam-1.neoforge.client]
account = { username = "BenchCam1", uuid = "0000000000000000000000000000be01" }
game_args = ["--width", "1920", "--height", "1080"]
options = { overrideWidth = "1920", overrideHeight = "1080", maxFps = "20", renderDistance = "24", graphicsMode = "1", entityShadows = "true", entityDistanceScaling = "5.0", biomeBlendRadius = "3", ao = "true", fov = "0.0", particles = "1", tutorialStep = "none", pauseOnLostFocus = "false", bobView = "false", soundCategory_master = "0.0" }

[profile.bench-cam-1.neoforge.client.display]
device = "gpu"
width = 1920
height = 1080

[profile.bench-cam-1.mods]
lithostitched = { target = ["client"] }
terralith = { target = ["client"] }
tectonic = { target = ["client"] }
sodium = { target = ["client"] }
iris = { target = ["client"] }

[profile.bench-cam-2.neoforge]
