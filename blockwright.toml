# The fuzzers (tests/fuzz): a server alone, over an empty flat world, running the mod jar that also carries the
# fuzzers' in-game classes (gradle fuzzJar).
[profile.fuzz.neoforge]
jvm_args = ["-Xmx3G"]

[profile.fuzz.neoforge.server]
world = "vanilla"
properties = { "level-seed" = "folkways-fuzz", "generate-structures" = "false", "spawn-monsters" = "false", "spawn-animals" = "false", "spawn-npcs" = "false", "max-tick-time" = "-1", "view-distance" = "4", "level-type" = "minecraft:flat", "generator-settings" = '{"biome":"minecraft:plains","features":false,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1}],"structure_overrides":[]}' }

[profile.fuzz.mods.folkways]
