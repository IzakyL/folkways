# Measures folkways itself, mixins included; off unless BLOCKWRIGHT_COVERAGE=1 (npm run test:coverage).
[coverage]
mods = ["folkways"]
sources = ["src/main/java"]

[profile.bench.neoforge]
jvm_args = ["-Xmx3G"]

[profile.bench.neoforge.server]
world = "vanilla"
properties = { "level-seed" = "folkways-bench", "generate-structures" = "false", "max-tick-time" = "-1", "view-distance" = "20", "entity-broadcast-range-percentage" = "300" }

[profile.bench.neoforge.client]
options = { overrideWidth = "1920", overrideHeight = "1080", renderDistance = "24", entityDistanceScaling = "5.0", fov = "0.0", particles = "1" }

[profile.promo.neoforge]
jvm_args = ["-Xmx3G"]

[profile.promo.neoforge.server]
world = "vanilla"
properties = { "level-seed" = "folkways-promo", "view-distance" = "12", "level-type" = "minecraft:flat", "generator-settings" = '{"biome":"minecraft:plains","features":false,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}' }

[profile.promo.neoforge.client]
game_args = ["--width", "1920", "--height", "1080"]
options = { guiScale = "2", overrideWidth = "1920", overrideHeight = "1080", maxFps = "260", renderDistance = "12", graphicsMode = "1", entityShadows = "true", entityDistanceScaling = "4.0", biomeBlendRadius = "3", ao = "true", tutorialStep = "none", pauseOnLostFocus = "false", bobView = "false", fovEffectScale = "0.0", soundCategory_music = "0.0", soundCategory_record = "0.0", soundCategory_ambient = "0.0" }

[profile.promo.neoforge.client.display]
device = "gpu"
width = 1920
height = 1080

[profile.promo.mods]
sodium = { target = ["client"] }
iris = { target = ["client"] }
sable = { target = ["server", "client"] }
create-aeronautics = { target = ["server", "client"] }

# The promo profile over generated terrain, for shots that fly above the landscape.
[profile.promo-sky.neoforge]
jvm_args = ["-Xmx3G"]

[profile.promo-sky.neoforge.server]
world = "vanilla"
properties = { "level-seed" = "folkways-promo", "view-distance" = "12" }

[profile.promo-sky.neoforge.client]
game_args = ["--width", "1920", "--height", "1080"]
options = { guiScale = "2", overrideWidth = "1920", overrideHeight = "1080", maxFps = "260", renderDistance = "12", graphicsMode = "1", entityShadows = "true", entityDistanceScaling = "4.0", biomeBlendRadius = "3", ao = "true", tutorialStep = "none", pauseOnLostFocus = "false", bobView = "false", fovEffectScale = "0.0", soundCategory_music = "0.0", soundCategory_record = "0.0", soundCategory_ambient = "0.0" }

[profile.promo-sky.neoforge.client.display]
device = "gpu"
width = 1920
height = 1080

[profile.promo-sky.mods]
sodium = { target = ["client"] }
iris = { target = ["client"] }
sable = { target = ["server", "client"] }
create-aeronautics = { target = ["server", "client"] }

# The fuzzers (tests/fuzz): a server alone, over an empty flat world, running the mod jar that also carries the
# fuzzers' in-game classes (gradle fuzzJar).
[profile.fuzz.neoforge]
jvm_args = ["-Xmx3G"]

[profile.fuzz.neoforge.server]
world = "vanilla"
properties = { "level-seed" = "folkways-fuzz", "generate-structures" = "false", "spawn-monsters" = "false", "spawn-animals" = "false", "spawn-npcs" = "false", "max-tick-time" = "-1", "view-distance" = "4", "level-type" = "minecraft:flat", "generator-settings" = '{"biome":"minecraft:plains","features":false,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1}],"structure_overrides":[]}' }

[profile.fuzz.mods.folkways]
path = "build/fuzz/folkways-*.jar"
