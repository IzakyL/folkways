[neoforge]
minecraft_version = "1.21.1"
loader_version = "21.1.233"
jvm_args = ["-Xmx2G"]

[neoforge.server]
eula = true
world = "flat"
properties = { "online-mode" = "false", "level-seed" = "folkways-e2e", "allow-flight" = "true" }

[neoforge.client]
connect = "127.0.0.1:25565"
options = { guiScale = "1", fullscreen = "false", overrideWidth = "1280", overrideHeight = "720" }

[mods.folkways]
path = "build/libs/folkways-*.jar"

[mods.ldlib2]
path = "build/deps/ldlib2-*.jar"

