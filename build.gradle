plugins {
    id "net.neoforged.moddev" version "2.0.141"
}

// The root builds no mod of its own. The suite table places test outputs in their runtime modules.
def modProjects = ["core", "vanilla", "airline", "assistant"]
def gameTests = new groovy.json.JsonSlurper().parse(file("tests/gametest/suites.json"))
modProjects.each { name ->
    def mod = project(":${name}")
    mod.plugins.withId("java") {
        gameTests.sources.values().findAll { it.project == name }.each { entry ->
            mod.sourceSets.matching { it.name == entry.sourceSet }.configureEach {
                def directory = rootProject.file("tests/gametest/${entry.directory}")
                java.setSrcDirs([new File(directory, "java")])
                resources.setSrcDirs([new File(directory, "resources")])
            }
        }
    }
}
modProjects.each { evaluationDependsOn(":${it}") }

def suiteNames = providers.gradleProperty("suite").getOrElse("core").split(",", -1)
    .collect { it.trim() }.unique()
suiteNames.each { name ->
    if (!gameTests.suites.containsKey(name)) {
        throw new GradleException("Unknown GameTest suite '${name}'; choose ${gameTests.suites.keySet().sort().join(', ')}")
    }
}
def suites = suiteNames.collect { gameTests.suites[it] }
def testedMods = modProjects.findAll { name -> suites.any { name in it.modules } }
def exclusiveSuite = suiteNames.find { gameTests.suites[it].exclusiveRun }
if (exclusiveSuite && suites.size() != 1) {
    throw new GradleException("GameTest suite ${exclusiveSuite} must run alone")
}
def mode = suites.find { it.mode }?.mode
def properties = [:]
def groups = [:]
def merge = { target, values, name ->
    values.each { key, value ->
        if (target.containsKey(key) && target[key] != value) {
            throw new GradleException("Incompatible GameTest suites ${suiteNames.join(', ')}: "
                + "${name} requires ${key}=${value}, already ${target[key]}")
        }
        target[key] = value
    }
}
suiteNames.each { name ->
    def suite = gameTests.suites[name]
    def excluded = (suite.excludesModules ?: []).intersect(testedMods)
    if (excluded) {
        throw new GradleException("GameTest suite ${name} cannot load ${excluded.join(', ')}")
    }
    merge(groups, suite.exclusiveGroups ?: [:], name)
    merge(properties, suite.properties ?: [:], name)
}
def testSources = suites.collectMany { it.sources }.unique().collect { gameTests.sources[it] }
def testLibraries = suites.collectMany { it.libs }.unique()
def testNamespaces = suites.collectMany { it.namespaces }.unique()
def testOutput = { entry -> project(":${entry.project}").sourceSets[entry.sourceSet] }
def gameTestDirectory = providers.gradleProperty("gameTestDirectory").getOrElse(
    suites.size() == 1 ? suites[0].directory : "run/gametest/${suiteNames.sort().join('+')}")
def listTests = providers.gradleProperty("listTests").map { file(it).absolutePath }

repositories {
    maven {
        url = "https://jitpack.io"
        content { includeGroup "com.github.IzakyL.jpi-mini" }
    }
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.firstdark.dev/snapshots" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_release.toInteger())
    }
}

def ldlib2Coordinate = "com.lowdragmc.ldlib2:ldlib2-neoforge-${project.minecraft_version}:${project.ldlib_version}:all"
def core = project(":core")

neoForge {
    version = project.neoforge_version

    mods {
        testedMods.each { name ->
            create("folkways_${name}") {
                sourceSet project(":${name}").sourceSets.main
                testSources.findAll { it.owner == name }.each { sourceSet testOutput(it) }
            }
        }
    }

    runs {
        gameTestServer {
            type = "gameTestServer"
            if (listTests.isPresent()) {
                systemProperty "folkways.listTests", listTests.get()
            }
            systemProperty "folkways.perfBudget", providers.gradleProperty("perfBudget").getOrElse("strict")
            systemProperty "folkways.tests", providers.gradleProperty("tests").getOrElse("")
            systemProperty "folkways.testShard", providers.gradleProperty("gameTestShard").getOrElse("")
            systemProperty "neoforge.enabledGameTestNamespaces", testNamespaces.join(",")
            properties.each { key, value -> systemProperty key, value }
            gameDirectory = layout.projectDirectory.dir(gameTestDirectory)
            programArgument "--nogui"
            programArgument "--mixin"
            programArgument "folkways-core-tests.mixins.json"
            if (mode == "save-upgrade") {
                programArgument "--world"
                programArgument "world"
            }
            if (mode == "airline") {
                jvmArgument "-Xmx4G"
                programArgument "--mixin"
                programArgument "folkways-airline-tests.mixins.json"
            }
        }
    }
}

configurations {
    instanceMod {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    testedMods.each { name -> runtimeOnly project(":${name}").sourceSets.main.output }
    testSources.each { runtimeOnly testOutput(it).output }
    testLibraries.each { runtimeOnly core.lib(it) }
    if (suites.any { it.saeculariaRuntime }) {
        runtimeOnly files(core.tasks.named("saeculariaRuntime"))
    }
    runtimeOnly("com.github.IzakyL.jpi-mini:jpi-mini-mc:0.1.0") { transitive = false }
    runtimeOnly ldlib2Coordinate
    additionalRuntimeClasspath project(":solve")
    additionalRuntimeClasspath project(":starlarkRuntime")

    instanceMod(ldlib2Coordinate) {
        transitive = false
    }
}

tasks.register("copyInstanceMods", Copy) {
    from configurations.instanceMod
    into layout.buildDirectory.dir("deps")
}

tasks.named("jar") {
    enabled = false
}

// Every mod's jar into build/libs, where the e2e instances find them.
def collectJars = tasks.register("collectJars", Sync) {
    modProjects.each { name -> from(project(":${name}").tasks.named("jar")) }
    into layout.buildDirectory.dir("libs")
}

tasks.named("build") {
    dependsOn collectJars, "copyInstanceMods"
    modProjects.each { dependsOn ":${it}:build" }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.java_release.toInteger()
}

tasks.register("lintScaffold") {
    group = "verification"
    description = "Checks scaffold sources for tabs and trailing whitespace."
    inputs.files(fileTree(projectDir) {
        include "**/*.java", "**/*.md", "**/*.gradle", "**/*.properties", "**/*.json", "**/*.toml"
        exclude "**/.gradle/**", "**/build/**", "**/run/**",
                "**/node_modules/**", "**/.blockwright/**", "**/.blockwright-store/**",
                "tests/out/**",
                "**/.claude/**", "tests/shared/assets/resident-models/**",
                "tests/promo/models/*/**",
                // Released saves are kept byte for byte as the game wrote them.
                "tests/fixtures/saves/**"
    })
    doLast {
        inputs.files.files.each { file ->
            file.eachLine { line, number ->
                if (line.contains("\t")) {
                    throw new GradleException("Tab character in ${file}:${number}")
                }
                if (line != line.stripTrailing()) {
                    throw new GradleException("Trailing whitespace in ${file}:${number}")
                }
            }
        }
    }
}

tasks.register("checkCorePackages", Exec) {
    group = "verification"
    description = "Checks core domain cycles, public API dependencies and plugin access."
    commandLine "python3", "tests/architecture/core-packages.py", "--check"
}

tasks.register("testDataUpgradeBoundaries", Exec) {
    group = "verification"
    description = "Tests migration boundaries and release freezing in isolated repositories."
    commandLine "python3", "tests/architecture/data-upgrades-test.py"
}

tasks.register("checkDataUpgrades", Exec) {
    dependsOn "testDataUpgradeBoundaries"
    group = "verification"
    description = "Checks migration boundaries and immutable released steps."
    commandLine "python3", "tests/architecture/data-upgrades.py"
}

tasks.register("checkNamespaces", Exec) {
    group = "verification"
    description = "Checks content namespaces and all four translation catalogs."
    commandLine "python3", "tests/architecture/namespaces.py"
}

tasks.register("checkV5Namespaces", Exec) {
    group = "verification"
    description = "Checks that the frozen V5 table maps every published legacy id to an id that exists."
    commandLine "python3", "tests/architecture/v5-namespaces.py"
}

tasks.register("compileGameTests") {
    group = "verification"
    description = "Compiles all GameTest sources and fixtures."
    gameTests.sources.values().findAll { it.owner }.each { entry ->
        dependsOn project(":${entry.project}").tasks.named(testOutput(entry).compileJavaTaskName)
    }
}

tasks.named("check") {
    dependsOn "checkNamespaces", "checkV5Namespaces"
    dependsOn "lintScaffold", "checkCorePackages", "checkDataUpgrades"
    modProjects.each { dependsOn ":${it}:check" }
    dependsOn ":solve:check", "compileGameTests"
}

if (mode == "save-upgrade") {
    def stageSaveUpgrade = tasks.register("stageSaveUpgrade", Sync) {
        from("tests/fixtures/saves/v4") {
            include "world/**", "config/**"
        }
        from("tests/fixtures/saves/v4/world/entities") {
            into "released-entities"
        }
        into gameTestDirectory
        // The server rewrites the world and configuration after every run.
        outputs.upToDateWhen { false }
        doLast {
            file("${gameTestDirectory}/eula.txt").text = "eula=true\n"
        }
    }
    tasks.named("runGameTestServer") {
        dependsOn stageSaveUpgrade
        doLast {
            if (listTests.isPresent()) {
                return
            }
            def log = file("${gameTestDirectory}/logs/latest.log")
            if (!log.isFile() || !log.text.contains("All 1 required tests passed")) {
                throw new GradleException("The save upgrade GameTest did not pass; see ${log}")
            }
            if (log.text.contains("Unknown legacy Folkways id")) {
                throw new GradleException("The save upgrade left unknown legacy ids; see ${log}")
            }
        }
    }
}

// ModDev writes the legacy classpath as paths without building the project artifacts on it.
tasks.named("prepareGameTestServerRun") {
    dependsOn configurations.additionalRuntimeClasspath
}

tasks.named("runGameTestServer") {
    if (listTests.isPresent()) {
        def output = file(listTests.get())
        doFirst {
            if (output.exists() && (!output.isFile() || !output.delete())) {
                throw new GradleException("Cannot replace GameTest list at ${output}")
            }
        }
        doLast {
            if (!output.isFile()) {
                throw new GradleException("GameTest server did not export its test list to ${output}")
            }
        }
    } else {
        doLast {
            def log = file("${gameTestDirectory}/logs/latest.log")
            if (!log.isFile() || !(log.text =~ /All [1-9][0-9]* required tests passed/).find()) {
                throw new GradleException("The GameTest server did not finish its required tests; see ${log}")
            }
        }
    }
}

// Prepare once, then launch independent JVMs without holding Gradle's project execution locks.
tasks.register("exportAirlineGameTestLaunch") {
    def run = tasks.named("runGameTestServer")
    dependsOn { run.get().taskDependencies.getDependencies(run.get()) }
    def output = layout.buildDirectory.file("airline-gametest-launch.json")
    outputs.file(output)
    outputs.upToDateWhen { false }
    doLast {
        if (suiteNames != ["airline"]) {
            throw new GradleException("exportAirlineGameTestLaunch requires -Psuite=airline")
        }
        def launch = run.get()
        launch.classpath(launch.classpathProvider)
        def command = [launch.javaLauncher.get().executablePath.asFile.absolutePath]
        command.addAll((launch.jvmArgs + launch.allJvmArgs).unique())
        command.addAll(["-cp", launch.classpath.asPath, launch.mainClass.get()])
        command.addAll(launch.args)
        output.get().asFile.text = groovy.json.JsonOutput.toJson([
            command: command, environment: launch.environmentProperty.get()
        ])
    }
}
