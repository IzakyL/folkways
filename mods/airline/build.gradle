plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_airline"
ext.modName = "folkways-airline"
apply from: rootProject.file("gradle/mod.gradle")
evaluationDependsOn(":core")
evaluationDependsOn(":vanilla")

dependencies {
    api project(":vanilla")
    compileOnly lib("create")
    compileOnly lib("sable"), lib("sable-companion")
    gametestImplementation project(":vanilla").sourceSets.gameTestFixtures.output
}
