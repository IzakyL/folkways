modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways Airline"
displayURL = "https://github.com/IzakyL/folkways"
description = "Airport surveys, towers and landing facilities."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_create"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "[2.0.6]"
ordering = "AFTER"
side = "BOTH"


[[mixins]]
config = "folkways-airline.mixins.json"


