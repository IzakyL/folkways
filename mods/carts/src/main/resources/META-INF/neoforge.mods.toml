modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways × AstikorCarts Redux"
displayURL = "https://github.com/IzakyL/folkways"
description = "Residents hitch cargo carts and haul goods in their storage."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "The colony engine and screens used by this extension are provided by Folkways Core."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "astikorcartsredux"
type = "required"
versionRange = "[1.2.4,1.3)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "folkways-carts.mixins.json"
