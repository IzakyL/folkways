plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_core"
ext.modName = "folkways-core"
apply from: rootProject.file("gradle/mod.gradle")

// Shared helpers stay in the core module to retain access to package-private planning internals.
// They contain no test registration, so consumers never load the core test suite to reuse them.
sourceSets {
    gameTestFixtures
}

neoForge {
    addModdingDependenciesTo sourceSets.gameTestFixtures
}

configurations {
    gameTestFixturesCompileOnly.extendsFrom compileOnly
    gameTestFixturesImplementation.extendsFrom implementation
    gameTestFixturesRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    gameTestFixturesImplementation sourceSets.main.output
    gameTestFixturesImplementation project(":vanilla")
    gametestImplementation sourceSets.gameTestFixtures.output
    compileOnly lib("emi")
    compileOnly lib("jei")
    compileOnly lib("jecharacters")
    // JEC supplies this at runtime; only its configuration ticket is used, and nothing is bundled here.
    compileOnly lib("pinin")
    compileOnly lib("shouldersurfing")
    compileOnly lib("create")
    compileOnly lib("sable"), lib("sable-companion")
    compileOnly lib("ftbteams"), lib("architectury")

    compileOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}") {
        transitive = false
    }
    jarJar("net.createmod.ponder:ponder-neoforge") {
        version {
            strictly "[${project.ponder_version},)"
            prefer project.ponder_version
        }
        transitive = false
    }
    jarJar("dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}") {
        version {
            strictly "[${project.flywheel_version},2.0)"
            prefer project.flywheel_version
        }
        transitive = false
    }
    api("com.lowdragmc.ldlib2:ldlib2-neoforge-${project.minecraft_version}:${project.ldlib_version}:all")

    // Engine integration tests use Vanilla's residents without loading Vanilla's test suite.
    gametestImplementation project(":vanilla")
}

def apiJar = tasks.register("apiJar", Jar) {
    archiveClassifier = "api"
    from sourceSets.main.output
    include "io/github/izakyl/folkways/core/api/**", "io/github/izakyl/folkways/front/api/**"
    includeEmptyDirs = false
}

publishing.publications.mod.artifact apiJar

// Native optional-integration tests share this mod's package and module, without linking its main source to Cookery.
dependencies {
    cookeryTestImplementation project(":cookery")
    cookeryTestCompileOnly lib("kaleidoscope_cookery")
}
