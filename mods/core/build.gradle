plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_core"
ext.modName = "folkways-core"
apply from: rootProject.file("gradle/mod.gradle")

// Shared helpers stay in the core module to retain access to package-private planning internals.
// They contain no test registration, so consumers never load the core test suite to reuse them.
sourceSets {
    gameTestFixtures
}

neoForge {
    addModdingDependenciesTo sourceSets.gameTestFixtures
}

configurations {
    gameTestFixturesCompileOnly.extendsFrom compileOnly
    gameTestFixturesImplementation.extendsFrom implementation
    gameTestFixturesRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    gameTestFixturesImplementation sourceSets.main.output
    gameTestFixturesImplementation project(":vanilla")
    gametestImplementation sourceSets.gameTestFixtures.output
    compileOnly lib("curios"), lib("accessories")
    compileOnly lib("emi")
    compileOnly lib("jei")
    compileOnly lib("jecharacters")
    // JEC supplies this at runtime; only its configuration ticket is used, and nothing is bundled here.
    compileOnly lib("pinin")
    compileOnly lib("shouldersurfing")
    compileOnly lib("create")
    compileOnly lib("sable"), lib("sable-companion")
    compileOnly lib("ftbteams"), lib("architectury")

    compileOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}") {
        transitive = false
    }
    jarJar("net.createmod.ponder:ponder-neoforge") {
        version {
            strictly "[${project.ponder_version},)"
            prefer project.ponder_version
        }
        transitive = false
    }
    jarJar("dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}") {
        version {
            strictly "[${project.flywheel_version},2.0)"
            prefer project.flywheel_version
        }
        transitive = false
    }
    api("com.lowdragmc.ldlib2:ldlib2-neoforge-${project.minecraft_version}:${project.ldlib_version}:all")

    // Engine integration tests use Vanilla's residents without loading Vanilla's test suite.
    gametestImplementation project(":vanilla")
}

def apiJar = tasks.register("apiJar", Jar) {
    archiveClassifier = "api"
    from sourceSets.main.output
    include "io/github/izakyl/folkways/core/front/api/**"
    include "io/github/izakyl/folkways/core/*/api/**", "io/github/izakyl/folkways/core/work/support/**"
    includeEmptyDirs = false
}

publishing.publications.mod.artifact apiJar

// Native optional-integration tests share this mod's package and module, without linking its main source to Cookery.
dependencies {
    cookeryTestImplementation project(":cookery")
    cookeryTestCompileOnly lib("kaleidoscope_cookery")
}

// Optional native fixtures stay out of the base Core suite and of every other profile.
["curiosTest", "accessoriesTest", "storageTest", "sophisticatedStorageTest", "sophisticatedBackpacksTest", "drawersTest", "functionalTest",
    "storageLaborTest", "ae2Test", "ae2LaborTest", "rs2Test", "rs2LaborTest",
    "createStorageTest", "tomsTest", "colossalTest", "qioTest", "portsLaborTest"].each { suite ->
    sourceSets.create(suite)
    neoForge.addModdingDependenciesTo(sourceSets[suite])
    configurations["${suite}CompileOnly"].extendsFrom configurations.compileOnly
    configurations["${suite}Implementation"].extendsFrom configurations.implementation
    configurations["${suite}RuntimeOnly"].extendsFrom configurations.runtimeOnly
    dependencies.add("${suite}Implementation", sourceSets.main.output)
    dependencies.add("${suite}Implementation", sourceSets.gameTestFixtures.output)
}
["sophisticatedStorageTest", "sophisticatedBackpacksTest", "drawersTest", "functionalTest",
    "storageLaborTest", "createStorageTest", "tomsTest", "colossalTest", "qioTest", "portsLaborTest"].each { suite ->
    dependencies.add("${suite}Implementation", sourceSets.storageTest.output)
}
dependencies {
    compileOnly lib("ae2"), lib("refinedstorage")
    compileOnly lib("fxntstorage"), lib("toms_storage"), lib("colossalchests"), lib("cyclopscore"), lib("mekanism")
    portsLaborTestImplementation project(":vanilla")
    ["createStorage", "toms", "colossal", "qio"].each { suite ->
        add("portsLaborTestImplementation", sourceSets["${suite}Test"].output)
    }
    compileOnly lib("sophisticatedcore"), lib("sophisticatedstorage"), lib("sophisticatedbackpacks")
    compileOnly lib("storagedrawers"), lib("functionalstorage"), lib("titanium")
    sophisticatedBackpacksTestImplementation project(":vanilla")
    curiosTestImplementation project(":vanilla")
    accessoriesTestImplementation project(":vanilla")
    storageLaborTestImplementation project(":vanilla")
    ae2LaborTestImplementation project(":vanilla")
    ae2LaborTestImplementation sourceSets.ae2Test.output
    rs2LaborTestImplementation project(":vanilla")
    rs2LaborTestImplementation sourceSets.rs2Test.output
}

tasks.named("compileGametestJava", JavaCompile) {
    // CURRENT is inlined into assertions; a version change must also rebuild otherwise unchanged tests.
    inputs.file("src/main/java/io/github/izakyl/folkways/core/base/persist/upgrade/DataVersion.java")
        .withPropertyName("dataVersion")
}

// Compile and register only the requested Core fixtures in a focused base run.
def coreGameTestClasses = providers.gradleProperty("coreGameTestClasses").getOrElse("")
if (coreGameTestClasses) {
    sourceSets.gametest.java.setIncludes(coreGameTestClasses.split(",").collect { "**/${it.trim()}.java" })
    def focusedClasses = layout.buildDirectory.dir("classes/java/focusedGametest/${coreGameTestClasses.hashCode()}")
    tasks.named("compileGametestJava", JavaCompile) {
        destinationDirectory = focusedClasses
    }
    sourceSets.gametest.output.classesDirs.setFrom(focusedClasses)
}
if (coreGameTestClasses || providers.gradleProperty("vanillaGameTestClasses").isPresent()
    || providers.gradleProperty("accessoryProfile").isPresent()) {
    sourceSets.gameTestFixtures.java.exclude("**/*GameTests.java")
    def focusedFixtures = layout.buildDirectory.dir("classes/java/focusedGameTestFixtures")
    tasks.named("compileGameTestFixturesJava", JavaCompile) {
        destinationDirectory = focusedFixtures
    }
    sourceSets.gameTestFixtures.output.classesDirs.setFrom(focusedFixtures)
}
