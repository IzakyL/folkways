plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_core"
ext.modName = "folkways-core"
apply from: rootProject.file("gradle/mod.gradle")

neoForge { addModdingDependenciesTo sourceSets.test }

dependencies {
    implementation project(":solve")
    jarJar project(":solve")

    compileOnly lib("curios"), lib("accessories")
    compileOnly lib("emi")
    compileOnly lib("jei")
    compileOnly lib("jecharacters")
    // JEC supplies this at runtime; only its configuration ticket is used, and nothing is bundled here.
    compileOnly lib("pinin")
    compileOnly lib("shouldersurfing")
    compileOnly lib("create"), lib("createfirefightingadd")
    compileOnly lib("createbigcannons"), lib("ritchiesprojectilelib")
    compileOnly lib("modulargolems"), lib("l2library"), lib("l2core"), lib("l2serial")
    compileOnly lib("epicfight")
    compileOnly lib("tacz"), lib("superbwarfare"), lib("kotlinforforge"), lib("geckolib")
    compileOnly lib("kaleidoscope_cookery"), lib("kaleidoscope_tavern"), lib("astikorcartsredux")
    compileOnly lib("chiselsandbits"), lib("chiselsandbits-api"), lib("chiselsandbits-core")
    compileOnly lib("scena"), lib("scena-core")
    compileOnly lib("sable"), lib("sable-companion"), lib("let_it_walk")
    compileOnly lib("ftbteams"), lib("architectury")

    compileOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}") {
        transitive = false
    }
    jarJar("net.createmod.ponder:ponder-neoforge") {
        version {
            strictly "[${project.ponder_version},)"
            prefer project.ponder_version
        }
        transitive = false
    }
    jarJar("dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}") {
        version {
            strictly "[${project.flywheel_version},2.0)"
            prefer project.flywheel_version
        }
        transitive = false
    }
    // Scripts are Starlark; the interpreter ships inside this mod's jar.
    api project(":starlarkRuntime")
    jarJar project(":starlarkRuntime")

    api("com.lowdragmc.ldlib2:ldlib2-neoforge-${project.minecraft_version}:${project.ldlib_version}:all")
}

def apiJar = tasks.register("apiJar", Jar) {
    archiveClassifier = "api"
    from sourceSets.main.output
    include "io/github/izakyl/folkways/core/front/api/**"
    include "io/github/izakyl/folkways/core/*/api/**", "io/github/izakyl/folkways/core/work/support/**"
    includeEmptyDirs = false
}

publishing.publications.mod.artifact apiJar

dependencies {
    compileOnly lib("ae2"), lib("refinedstorage")
    compileOnly lib("fxntstorage"), lib("toms_storage"), lib("colossalchests"), lib("cyclopscore"), lib("mekanism")
    compileOnly lib("sophisticatedstorage"), lib("sophisticatedbackpacks"), lib("sophisticatedcore")
    compileOnly lib("storagedrawers"), lib("functionalstorage"), lib("titanium")
}

// C&B 21.1.33 bundles this library as MOD without a mod descriptor, so NeoForge discards it (#1343 upstream).
// Keep its pinned bytes and license; only the library manifest changes so the required class can be loaded.
// The jar-in-jar entry shares upstream's identifier at 21.1.11.1, so NeoForge loads exactly one copy: this one
// beside C&B 21.1.33 (and older), the newer upstream build beside C&B releases that bundle one.
def saeculariaRuntime = tasks.register("saeculariaRuntime", Jar) {
    archiveFileName = "folkways-saecularia-runtime.jar"
    destinationDirectory = layout.buildDirectory.dir("runtime")
    from({ zipTree(lib("saecularia-core").singleFile) }) {
        exclude "META-INF/MANIFEST.MF"
    }
    from("src/main/resources/META-INF/licenses") { into "META-INF/licenses" }
    manifest.attributes("FMLModType": "GAMELIBRARY", "Automatic-Module-Name": "folkways_saecularia_runtime")
}

tasks.named("jarJar") {
    def metadata = file("src/jarJar/saecularia.json")
    inputs.file(metadata)
    inputs.file(saeculariaRuntime.flatMap { it.archiveFile })
    doLast {
        def directory = outputDirectory.get().dir("META-INF/jarjar").asFile
        def manifest = new File(directory, "metadata.json")
        def parser = new groovy.json.JsonSlurper()
        def jars = parser.parse(manifest).jars + parser.parse(metadata).jars
        manifest.text = groovy.json.JsonOutput.toJson([jars: jars]) + "\n"
        copy {
            from saeculariaRuntime
            into directory
        }
    }
}

// The pinned Gradle distribution supplies JUnit 4 for the offline save migration checks.
dependencies {
    testImplementation fileTree(dir: new File(gradle.gradleHomeDir, "lib"),
        include: ["junit-4.*.jar", "hamcrest-core-*.jar"])
}

tasks.named("check") {
    dependsOn tasks.named("jarJar")
}
