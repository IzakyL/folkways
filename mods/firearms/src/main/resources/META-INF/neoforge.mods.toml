modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways Firearms"
displayURL = "https://github.com/IzakyL/folkways"
description = "Residents use TACZ and Superb Warfare firearms and emplacements with physical ammunition from colony stores. Each integration activates when its native mod is installed."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "The colony engine and screens used by this extension are provided by Folkways Core."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
reason = "Firearms extends the residents and combat provided by Folkways Vanilla."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tacz"
type = "optional"
versionRange = "[1.1.8-hotfix-r7]"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "folkways-firearms-tacz.mixins.json"

[[dependencies.${mod_id}]]
modId = "superbwarfare"
type = "optional"
reason = "Enables resident firearms and emplacements from Superb Warfare."
versionRange = "[0.8.9.2]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "optional"
reason = "Superb Warfare exposes Kotlin APIs."
versionRange = "[5.12.0,6)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "folkways-firearms-warfare.mixins.json"
