plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_firefighting"
ext.modName = "folkways-firefighting"
apply from: rootProject.file("gradle/mod.gradle")
evaluationDependsOn(":core")
evaluationDependsOn(":vanilla")
evaluationDependsOn(":create")

dependencies {
    api project(":vanilla")
    implementation project(":create")
    compileOnly lib("create")
    compileOnly lib("createfirefightingadd")
    gametestImplementation project(":core").sourceSets.gameTestFixtures.output
}
