modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways × Modular Golems"
displayURL = "https://github.com/IzakyL/folkways"
description = "Modular Golems as a second sort of Folkways resident: they take trades, join the roster and are dispatched like people."
authors = "IzakyL"

[modproperties.${mod_id}]
folkwaysBuildIdentity = "${build_identity}"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "Golems join the colony Folkways Core runs."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
reason = "Golems take up Folkways Vanilla's trades."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "modulargolems"
type = "required"
reason = "The residents this mod adds are Modular Golems."
versionRange = "[3.1.43,)"
ordering = "AFTER"
side = "BOTH"
