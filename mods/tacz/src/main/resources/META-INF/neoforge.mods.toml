modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways × TACZ"
displayURL = "https://github.com/IzakyL/folkways"
description = "Residents use TACZ guns with physical ammunition and local colony supplies."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "The colony engine and screens used by this extension are provided by Folkways Core."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
reason = "TACZ extends the residents and combat provided by Folkways Vanilla."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tacz"
type = "required"
versionRange = "[1.1.8-hotfix-r7]"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "folkways-tacz.mixins.json"
