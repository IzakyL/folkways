plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_vanilla"
ext.modName = "folkways-vanilla"
apply from: rootProject.file("gradle/mod.gradle")
evaluationDependsOn(":core")

dependencies {
    api project(":core")

    compileOnly lib("geckolib")
    compileOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}") {
        transitive = false
    }
    // Patterns are Starlark; the interpreter ships inside this mod's jar.
    implementation("com.eed3si9n.starlark:starlark:${project.starlark_version}") {
        transitive = false
    }
    jarJar("com.eed3si9n.starlark:starlark") {
        version {
            strictly "[${project.starlark_version},5.0)"
            prefer project.starlark_version
        }
        transitive = false
    }

    gametestImplementation project(":core").sourceSets.gameTestFixtures.output
    // Patterns that lay Create's track are tested here, against the draft's own package, with Folkways × Create
    // loaded beside them in the game tests' run.
    gametestCompileOnly lib("create")
}

// Native optional-integration tests share this mod's package and module, without linking its main source to Cookery.
dependencies {
    cookeryTestImplementation project(":cookery")
    cookeryTestCompileOnly lib("kaleidoscope_cookery")
}

// The recipe audit is one fixture shared by native kitchen and vanilla crafting tests in their own modules.
sourceSets.cookeryTest.resources.srcDir(rootProject.file("mods/cookery/src/gametest/resources"))

// Main and test resources share one mod pack; an overlapping test tag must retain the shipped entries.
tasks.named("processGametestResources") {
    def forage = file("src/main/resources/data/folkways_vanilla/tags/block/forage.json")
    inputs.file(forage)
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def shipped = parser.parse(forage)
        def extra = parser.parse(file("src/gametest/resources/data/folkways_vanilla/tags/block/forage.json"))
        def merged = [replace: false, values: shipped.values + extra.values]
        file("${destinationDir}/data/folkways_vanilla/tags/block/forage.json").text = groovy.json.JsonOutput.toJson(merged) + "\n"
    }
}

// Warfare's scout acceptance fixture exercises the package-private patrol service in Vanilla's module.
sourceSets { warfareTest }
neoForge { addModdingDependenciesTo sourceSets.warfareTest }
configurations {
    warfareTestCompileOnly.extendsFrom gametestCompileOnly
    warfareTestImplementation.extendsFrom gametestImplementation
    warfareTestRuntimeOnly.extendsFrom gametestRuntimeOnly
}
dependencies {
    warfareTestImplementation sourceSets.main.output
}

// Focused native combat fixtures compile into a separate output, so stale broad-suite classes cannot register.
def vanillaGameTestClasses = providers.gradleProperty("vanillaGameTestClasses").getOrElse("")
if (vanillaGameTestClasses) {
    sourceSets.gametest.java.setIncludes(vanillaGameTestClasses.split(",").collect { "**/${it.trim()}.java" })
    def focused = layout.buildDirectory.dir("classes/java/focusedGametest/${vanillaGameTestClasses.hashCode()}")
    tasks.named("compileGametestJava", JavaCompile) {
        destinationDirectory = focused
        doFirst {
            def selected = source.files.collect { it.name }.sort()
            def expected = vanillaGameTestClasses.split(",").collect { "${it.trim()}.java" }.sort()
            if (selected != expected) {
                throw new GradleException("Focused Vanilla source filter differs: ${selected}")
            }
            logger.lifecycle("Focused Vanilla GameTests: ${selected.join(', ')}")
        }
    }
    sourceSets.gametest.output.classesDirs.setFrom(focused)
}
