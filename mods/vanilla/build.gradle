plugins {
    id "net.neoforged.moddev"
    id "java-library"
    id "maven-publish"
}

ext.modId = "folkways_vanilla"
ext.modName = "folkways-vanilla"
apply from: rootProject.file("gradle/mod.gradle")
evaluationDependsOn(":core")
apply from: rootProject.file("gradle/core-gametests.gradle")

// These fixtures access package-private Vanilla types and load with Vanilla.
sourceSets { vanillaGameTestFixtures }
neoForge.addModdingDependenciesTo(sourceSets.vanillaGameTestFixtures)

dependencies {
    vanillaGameTestFixturesImplementation project(":core")
    vanillaGameTestFixturesImplementation sourceSets.main.output
    api project(":core")
    implementation project(":solve")

    compileOnly lib("create"), lib("createfirefightingadd")
    compileOnly lib("toms_storage")
    compileOnly lib("geckolib"), lib("epicfight")
    compileOnly lib("tacz"), lib("superbwarfare"), lib("kotlinforforge")
    compileOnly lib("kaleidoscope_cookery"), lib("kaleidoscope_tavern"), lib("astikorcartsredux")
    compileOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}") {
        transitive = false
    }

    gametestImplementation sourceSets.gameTestFixtures.output
    gametestImplementation sourceSets.vanillaGameTestFixtures.output
    // The draft tests use native Create tracks through the Core integration.
    gametestCompileOnly lib("create")
}

// Optional suites stay out of the base Vanilla test source set.
["cookeryIntegrationTest", "cartsIntegrationTest"].each { name ->
    def suite = sourceSets.create(name)
    neoForge.addModdingDependenciesTo(suite)
    configurations[suite.compileOnlyConfigurationName].extendsFrom(configurations.gametestCompileOnly)
    configurations[suite.implementationConfigurationName].extendsFrom(configurations.gametestImplementation)
    dependencies.add(suite.implementationConfigurationName, sourceSets.main.output)
}
dependencies {
    cookeryTestImplementation sourceSets.cookeryIntegrationTest.output
}

// Main and test resources share one mod pack; an overlapping test tag must retain the shipped entries.
tasks.named("processGametestResources") {
    def forage = file("src/main/resources/data/folkways_vanilla/tags/block/forage.json")
    def extraForage = sourceSets.gametest.resources.sourceDirectories.singleFile
        .toPath().resolve("data/folkways_vanilla/tags/block/forage.json").toFile()
    inputs.file(forage)
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def shipped = parser.parse(forage)
        def extra = parser.parse(extraForage)
        def merged = [replace: false, values: shipped.values + extra.values]
        file("${destinationDir}/data/folkways_vanilla/tags/block/forage.json").text = groovy.json.JsonOutput.toJson(merged) + "\n"
    }
}

// Native integration fixtures only join their selected GameTest profiles.
["taczTest", "warfareTest", "sableTest", "createTest", "coreCreateTest", "firefightingTest", "saveUpgradeTest"].each { name ->
    def suite = sourceSets.create(name)
    neoForge.addModdingDependenciesTo(suite)
    configurations[suite.compileOnlyConfigurationName].extendsFrom(configurations.gametestCompileOnly)
    configurations[suite.implementationConfigurationName].extendsFrom(configurations.gametestImplementation)
    dependencies.add(suite.implementationConfigurationName, sourceSets.main.output)
}
dependencies {
    createTestImplementation sourceSets.gameTestFixtures.output
    saveUpgradeTestCompileOnly lib("kaleidoscope_cookery"), lib("chiselsandbits"),
        lib("chiselsandbits-api"), lib("chiselsandbits-core"), lib("scena-core")
    firefightingTestCompileOnly lib("createfirefightingadd")
    sableTestCompileOnly lib("sable"), lib("sable-companion")
    warfareTestCompileOnly lib("sable"), lib("sable-companion")
    warfareTestImplementation project(":airline")
    // The walker and hull cannon fixtures also probe a copy in the Assistant's sandbox.
    letItWalkTestImplementation project(":assistant")
    cbcTestImplementation project(":assistant")
}

if (project.findProperty("letItWalkTests") == "true" && project.findProperty("cbcTests") == "true") {
    dependencies.add("cbcTestImplementation", sourceSets.letItWalkTest.output)
} else {
    sourceSets.cbcTest.java.exclude("**/CbcWalkerGameTests.java")
}

// Focused fixtures compile into a separate output, so stale broad-suite classes cannot register.
def vanillaGameTestClassesProperty = providers.gradleProperty("vanillaGameTestClasses")
if (vanillaGameTestClassesProperty.isPresent()) {
    // The Core cart fixture only runs with the full cart suite.
    sourceSets.cartsIntegrationTest.java.exclude("**/CartContentsGameTests.java")
}
def vanillaGameTestClasses = vanillaGameTestClassesProperty.getOrElse("")
// Warfare fixtures share classes across the source set and are filtered when they register.
if (vanillaGameTestClasses && project.findProperty("warfareTests") != "true") {
    def suite = project.findProperty("createTests") == "true" ? sourceSets.createTest
        : project.findProperty("taczTests") == "true" ? sourceSets.taczTest
        : project.findProperty("cartsTests") == "true" ? sourceSets.cartsIntegrationTest
        : project.findProperty("chiselsTests") == "true" ? sourceSets.chiselsandbitsTest
        : project.findProperty("cookeryTests") == "true" && project.findProperty("vanillaBaseTests") != "true"
            ? sourceSets.cookeryIntegrationTest
        : sourceSets.gametest
    def selectedClasses = vanillaGameTestClasses.split(",").collect { it.trim() }
    def simpleNames = selectedClasses.collect { it.tokenize(".").last() }
    // These helpers share Vanilla packages and have no tests to register.
    def supportClasses = []
    if (suite == sourceSets.createTest) {
        // Focused Create runs can exercise the base pattern fixtures against native track.
        sourceSets.gametest.java.srcDirs.each { suite.java.srcDir(it) }
        if (simpleNames.any { it in ["RailwayPatternGameTests", "DraftRoadGameTests"] }) {
            supportClasses.add("DraftKit")
        }
    }
    if (suite == sourceSets.chiselsandbitsTest) {
        supportClasses.addAll(["CandBTestData", "PatternChecks"])
    }
    if (suite == sourceSets.gametest && selectedClasses.contains("MineOneShotGameTests")) {
        supportClasses.add("DraftKit")
    }
    if (suite == sourceSets.gametest
        && selectedClasses.any { it in ["DiningFoodsGameTests", "LivingEatingGameTests", "LivingEffectsGameTests"] }) {
        supportClasses.add("EatingFixture")
    }
    if (suite == sourceSets.taczTest && selectedClasses.contains("TaczSupplyGameTests")) {
        supportClasses.add("TaczWeaponGameTests")
    }
    def sourceClasses = (selectedClasses + supportClasses).unique()
    suite.java.setIncludes(sourceClasses.collect { it.contains(".") ? it.replace(".", "/") + ".java" : "**/${it}.java" })
    def focused = layout.buildDirectory.dir("classes/java/focusedGametest/${suite.name}/${vanillaGameTestClasses.hashCode()}")
    tasks.named(suite.compileJavaTaskName, JavaCompile) {
        destinationDirectory = focused
        doFirst {
            def selected = source.files.collect { it.name }.sort()
            def expected = sourceClasses.collect { "${it.tokenize('.').last()}.java" }.sort()
            if (selected != expected) {
                throw new GradleException("Focused Vanilla source filter differs: ${selected}")
            }
            logger.lifecycle("Focused Vanilla GameTests: ${selected.join(', ')}")
        }
    }
    suite.output.classesDirs.setFrom(focused)
}

// The Create adapter fixtures register under Core even though their sources live here.
def coreCreateGameTestClasses = project.findProperty("createTests") == "true"
    ? providers.gradleProperty("coreGameTestClasses").getOrElse("") : ""
if (coreCreateGameTestClasses) {
    def suite = sourceSets.coreCreateTest
    suite.java.setIncludes(coreCreateGameTestClasses.split(",").collect { "**/${it.trim()}.java" })
    def focused = layout.buildDirectory.dir("classes/java/focusedGametest/${suite.name}/${coreCreateGameTestClasses.hashCode()}")
    tasks.named(suite.compileJavaTaskName, JavaCompile) {
        destinationDirectory = focused
    }
    suite.output.classesDirs.setFrom(focused)
}

sourceSets { epicfightTest }
neoForge { addModdingDependenciesTo sourceSets.epicfightTest }
configurations {
    epicfightTestCompileOnly.extendsFrom gametestCompileOnly
    epicfightTestImplementation.extendsFrom gametestImplementation
}
dependencies {
    epicfightTestImplementation sourceSets.main.output
}

tasks.named("processSaveUpgradeTestResources") {
    from(project(":core").file("src/main/resources/data/folkways_core/structure/empty.nbt")) {
        into "data/folkways_save_upgrade/structure"
    }
}
