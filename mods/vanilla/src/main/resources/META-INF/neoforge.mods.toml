modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways Vanilla"
displayURL = "https://github.com/IzakyL/folkways"
description = "Settlers who plan their own work. Found a colony, mark out fields, pens and fishing waters, and the settlement schedules the whole day's labour for itself."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "Folkways Vanilla is the work residents do; the colony that plans it is Folkways Core."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "optional"
reason = "Resident looks that name a bedrock model instead of a skin are rendered by GeckoLib. Without it those looks fall back to a plain player skin; everything else is unaffected."
versionRange = "[4.9,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "folkways-build.mixins.json"

[[mixins]]
config = "folkways-wares.mixins.json"

[[mixins]]
config = "folkways-person.mixins.json"
