modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/IzakyL/folkways/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Folkways War"
displayURL = "https://github.com/IzakyL/folkways"
description = "Optional colony raids with native monsters and resident defenders."
authors = "IzakyL"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_requirement}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_core"
type = "required"
reason = "The colony engine and screens used by this extension are provided by Folkways Core."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "folkways_vanilla"
type = "required"
reason = "War uses the resident combat and guard systems provided by Folkways Vanilla."
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "folkways-war.mixins.json"
