pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url = "https://libraries.minecraft.net/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

rootProject.name = "folkways"

// Each Folkways mod is a project of its own under mods/; the root runs them together for the game tests.
["core", "vanilla", "create", "modulargolems", "cookery", "rts", "warfare", "tacz",
    "firefighting", "epicfite"].each { name ->
    include ":${name}"
    project(":${name}").projectDir = file("mods/${name}")
}

// Client fixture used only by the offscreen combat promo profile.
include ":capture"
project(":capture").projectDir = file("tests/promo/capture")
