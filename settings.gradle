pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url = "https://libraries.minecraft.net/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

rootProject.name = "folkways"

// Each Folkways mod is a project of its own under mods/; the root runs them together for the game tests.
["core", "vanilla", "create", "modulargolems", "cookery", "war", "epicfite"].each { name ->
    include ":${name}"
    project(":${name}").projectDir = file("mods/${name}")
}
