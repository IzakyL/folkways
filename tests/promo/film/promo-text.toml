# 宣传片里出现的全部文字。改完在仓库根目录运行：npm run promo:film
#
# 注释用 # 开头（TOML 不认 //）。
#
# 片子的顺序：开头说明 → workforce → household → workshop → field → woodlot → tour → schematic → draft → logistics → rail → models → airship → 结尾。
# 每段是一段连续的镜头（中间等待的部分会快进，不剪断）；workforce 和 household、schematic 和 draft 各是同一段镜头的前后两截。
#
# 镜头字幕：[scenes.<段落>]
#   tag      = 字幕上方的金色小标签，可留空 ""
#   captions = 这一段显示的文字，一项一行，所有行同时出现、同时消失：captions = ["第一行", "第二行"]
#   能用的段落：workforce  household  workshop  field  woodlot  tour  draft  schematic  logistics  rail  models  airship
#   删掉某个段落 = 那一段不出字。
#
# 角标：在任何文字里写 [^1]、[^2]……（也可以用字母，如 [^a]），画面上会在那个位置显示一个金色小角标。
#   角标对应的注释写在文件末尾的 [notes] 里；生成时会把它们按出现顺序写进 tests/out/promo/film/description-notes.txt，
#   直接贴进视频简介即可。
#
# 黑屏卡片：[cards.disclaimer]、[cards.ending]
#   删掉某张卡 = 片子里不要这张卡。
#   seconds  = 卡片时长（秒）
#   left/top = 可选：文字块左上角的位置（按 1920x1080 计的像素），写了就左对齐；不写则整体居中
#   lines    = 从上到下的每一行，style 可选：
#              big   大标题        label 金色小标签
#              body  正文          url   醒目的链接
#              note  灰色小字      gap   空行（text 留空）

# ── 开头说明 ───────────────────────────────────────────
[cards.disclaimer]
seconds = 11
lines = [
