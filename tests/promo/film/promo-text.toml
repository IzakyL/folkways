# ── 角标注释（写进简介）──────────────────────────────────
# 键是角标里写的编号，例如字幕里写了 [^1]，这里就写 1 = "……"
[notes]
1 = """
"主要的原版玩法"目前包括：
· 农业：耕地、播种、收割原版作物（包括甘蔗、竹子、西瓜、南瓜），种树苗并伐木的林地
· 畜牧：牛、羊、猪、鸡按目标头数繁殖或宰杀，持续获取对应的资源
· 钓鱼：在圈定的岸边用钓鱼竿钓鱼
· 工坊：使用工作台、切石机、锻造台、熔炉、高炉、烟熏炉（自动添加燃料）
· 订单：让箱子常备某种物品，殖民地自己搬运、合成、烧炼来补足
· 巡逻：沿巡逻路线巡视，攻击遇到的敌对生物
· 建造：清理场地，从殖民地仓库取材料建造"""
2 = """
本模组的玩法通过插件组织：
· 模组提供具体玩法无关的插件API
· 通过插件API，可以轻松实现新的游戏内容
· 详见GitHub仓库"""
3 = """
Starlark 是一种类 Python 语言
本模组为其实现了类 CGA shape 的形状语法，以及 Minecraft 所需要的离散化方法
游玩时，只需要设置一个区域/一段折线以及需要的参数，便可直接生成建筑实例
模组已经包含的样式有：
· 道路（折线）：沿线挖填找平后铺路，路面和路缘可选材料，可选沿路路灯
· 拱桥（折线）：石拱桥，包括桥台、拱圈、桥面和护栏
· 城墙（折线）：可调高度和厚度，按间距设塔楼，可选城门
· 码头（折线）：木栈桥，端头可选 T 形、L 形、方形或不设，可选顶棚
· 铁路（折线）：铺设 Create 轨道，连同道砟、路基和砖石结构
· 风雨廊（折线）：带屋顶的木柱廊道，可选两坡或单坡屋顶、亭子、栏杆和灯
· 矿井（区域）：从矿口挖阶梯下到所选矿层（浅层、铜、铁、金、钻石），再开成对的支巷，可选顺着矿脉挖
· 梯田（区域）：把坡地改成层层梯田，带挡土墙、田埂、步道和台阶，可选围栏"""
4 = """
"简单 Create 物流网络"需要：
· 网络上的每台打包机都只把包裹交给旁边的货物蛙港
· 这些蛙港都挂在同一张相连的锁链滑轮网络上
· 链条在转动
· 整个网络在同一维度且处于加载范围内
· 一台仓储发报机作为柜台，并有调度工种的居民在旁值守，殖民地才会使用这个网络"""
5 = """
"简单 Create 列车网络"需要：
· 列车由殖民地接管（副手拿殖民书，对驾驶座使用时刻表）
· 时刻表的每一项都是"停靠某个车站"，至少停靠两个车站
· 站名不使用通配名，即每个站名只对应一个车站
· 每站的停站条件只有定时条件
· 车上有列车长、还有空座，居民才会把它当作出行方式，在站与站之间乘坐"""
