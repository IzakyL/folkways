# 宣传片里出现的全部文字。改完在仓库根目录运行：npm run promo:film
#
# 注释用 # 开头（TOML 不认 //）。
#
# 片子的顺序：开头说明 → tour → schematic → draft → logistics → rail → models → airship → 结尾。
# 每段是一段连续的镜头（中间等待的部分会快进，不剪断）；schematic 和 draft 是同一段镜头的前后两截。
#
# 镜头字幕：[scenes.<段落>]
#   tag      = 字幕上方的金色小标签，可留空 ""
#   captions = 这一段显示的文字，一项一行，所有行同时出现、同时消失：captions = ["第一行", "第二行"]
#   能用的段落：tour  draft  schematic  logistics  rail  models  airship
#   删掉某个段落 = 那一段不出字。
#
# 角标：在任何文字里写 [^1]、[^2]……（也可以用字母，如 [^a]），画面上会在那个位置显示一个金色小角标。
#   角标对应的注释写在文件末尾的 [notes] 里；生成时会把它们按出现顺序写进 tests/out/promo/film/description-notes.txt，
#   直接贴进视频简介即可。
#
# 黑屏卡片：[cards.disclaimer]、[cards.ending]
#   删掉某张卡 = 片子里不要这张卡。
#   seconds  = 卡片时长（秒）
#   lines    = 从上到下的每一行，style 可选：
#              big   大标题        label 金色小标签
#              body  正文          url   醒目的链接
#              note  灰色小字      gap   空行（text 留空）

# ── 开头说明 ───────────────────────────────────────────
[cards.disclaimer]
seconds = 11
lines = [
  { style = "body",  text = "本模组仍处于早期开发阶段，可能存在各种 bug 和未完成的功能。" },
  { style = "gap",   text = "" },
  { style = "body",  text = "本片由自动化测试脚本拍摄：部分游戏逻辑被手动更改；部分镜头经剪辑加速。" },
  { style = "body",  text = "实际游玩的节奏和画面可能有所不同。" },
]

# ── 蓝图 → 建造房屋（同一段镜头）──────────────────────────
[scenes.schematic]
captions = [
  "支持：将 Create 蓝图交给殖民地建造",
  "需要：Create 6.0.10 及以上",
]

[scenes.draft]
captions = [
  "通过 Draft 功能轻松建造多样的建筑",
  "可通过数据包加载 Starlark 代码以实现自定义的建筑样式",
  "详见 https://github.com/IzakyL/folkways",
]

# ── 其他段落 ───────────────────────────────────────────
[scenes.logistics]
captions = [
  "支持：殖民地使用简单 Create 物流网络",
  "需要 Create 6.0.10 及以上",
]

[scenes.rail]
captions = [
  "支持：殖民地使用简单 Create 列车网络",
  "需要 Create 6.0.10 及以上",
]

[scenes.models]
captions = ["支持：非加密的 YSM 模型"]

[scenes.airship]
captions = [
  "支持：殖民地在 Create Aeronautics 结构上运行",
  "跨越多个结构的殖民地可能存在性能问题",
  "需要 Create Aeronautics 1.3.2 及以上",
]

# ── 结尾 ───────────────────────────────────────────────
[cards.ending]
seconds = 9
lines = [
  { style = "url",   text = "通过 https://github.com/IzakyL/folkways/releases/tag/nightly 获取" },
]

# ── 角标注释（写进简介）──────────────────────────────────
# 键是角标里写的编号，例如字幕里写了 [^1]，这里就写 1 = "……"
[notes]
